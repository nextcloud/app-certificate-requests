name: Validate CSR Common Name
on:
  pull_request:
    paths:
      - '**/*.csr'

jobs:
  validate-csr-cn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5
        with:
          fetch-depth: 2
          sparse-checkout: |
            *.csr
          sparse-checkout-cone-mode: false

      - name: Get changed CSR files
        id: changed_csrs
        run: |
          files=$(git diff --name-only --diff-filter=AMR ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.csr$' | xargs)
          echo "csr_files=$files" >> $GITHUB_OUTPUT

      - name: Validate each CSR
        if: ${{ steps.changed_csrs.outputs.csr_files }}
        run: |
          set -euo pipefail

          for csr in ${{ steps.changed_csrs.outputs.csr_files }}; do
            filename=$(echo $csr | awk -F "[/.]" '{ print $2 }')
            if ! subject=$(openssl req -in "$csr" -noout -subject 2>&1); then
              echo "::error file=$csr::Unable to read the CSR. Make sure '$csr' is a valid PEM-encoded certificate signing request."
              echo "OpenSSL output: $subject"
              exit 1
            fi

            if ! echo "$subject" | awk -v app_id="$filename" -F "[= ]" '{ if ($5 == app_id) { exit 0 } else { exit 1 }}'; then
              echo "::error file=$csr::CSR Common Name does not match the expected app ID '$filename'."
              echo "The CSR subject is: $subject"
              echo "The Common Name (CN) in the CSR must match the app ID used in appinfo/info.xml."
              echo "See https://nextcloudappstore.readthedocs.io/en/latest/developer.html#obtaining-a-certificate for instructions."
              exit 1
            fi
          done
